org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter's Gradle plugin still uses the legacy AGP DSL; Flutter's AGP 9 migration guide requires this flag.
android.newDsl=false
# Built-in Kotlin is OFF by default here: enabling it needs EVERY Flutter plugin to be migrated. After
# `flutter build apk --debug` passes, try `true` (Flutter >= 3.47) and remove `id("kotlin-android")` from app/build.gradle.kts.
android.builtInKotlin=false
