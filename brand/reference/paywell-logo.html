<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAYWELL — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#060C1B;--bg2:#0D1A33;--ink:#F4F7FC;--mut:#8593AE;--acc:#35E0B0;--b1:#FFFFFF;--b2:#5C86E6;--ln:rgba(255,255,255,.16);--gl:rgba(70,120,255,.20)}
:root.light{color-scheme:light;--bg:#FFFFFF;--bg2:#EEF3FA;--ink:#0B1F3A;--mut:#5F6E87;--acc:#0FB98A;--b1:#0B1F3A;--b2:#3D6FD8;--ln:rgba(11,31,58,.18);--gl:rgba(61,111,216,.10)}
html{height:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);overflow:hidden;background:radial-gradient(ellipse at 50% 45%,var(--bg2) 0%,var(--bg) 72%)}
.stage{position:relative;padding:24px}
.glow{position:absolute;left:50%;top:50%;width:min(110vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--gl),transparent 62%);pointer-events:none}
.lock{position:relative;display:flex;align-items:center;gap:clamp(14px,3.6vw,26px)}
svg{height:clamp(92px,25vw,136px);width:auto;overflow:visible}
.vd{width:1px;height:clamp(60px,15vw,86px);background:var(--ln);transform-origin:top}
.word{display:flex;font-weight:500;font-size:clamp(24px,6.8vw,36px);line-height:1}
.m{display:block;overflow:hidden;letter-spacing:.3em;padding:0 0 .04em}
.c{display:block}
.rule{height:1px;margin:13px 0 11px;background:var(--acc);transform-origin:left}
.tag{font-weight:300;font-size:clamp(8.5px,2.2vw,11.5px);letter-spacing:.34em;color:var(--mut)}
.bar{transform-box:fill-box;transform-origin:0 50%}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="PAYWELL logo">
<div class="glow" id="glow"></div>
<div class="lock">
<svg id="mark" viewBox="36 30 140 164" role="img" aria-label="PAYWELL monogram: a P built from horizontal data-stream bands, with one band highlighted as verified">
<defs>
<linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="182"><stop offset="0" style="stop-color:var(--b1)"/><stop offset="1" style="stop-color:var(--b2)"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="pc"><path clip-rule="evenodd" d="M52 40 H112 A48 48 0 0 1 112 136 H86 V182 H52 Z M86 64 H112 A24 24 0 0 1 112 112 H86 Z"/></clipPath>
</defs>
<g clip-path="url(#pc)">
<g id="bands"></g>
<polygon id="shine" fill="url(#sh)" opacity="0" points="20,30 74,30 44,190 -10,190"/>
</g>
</svg>
<div class="vd" id="vd"></div>
<div class="wm"><div class="word" id="word"></div><div class="rule" id="rule"></div><div class="tag" id="tag">SIMPLE. FAST. SECURE.</div></div>
</div>
</main>
<script>
(function(){
var ns='http://www.w3.org/2000/svg',T=6500,N=12,ACC=4,EO='cubic-bezier(.16,1,.3,1)';
var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function $(i){return document.getElementById(i)}
function mk(t,a){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function A(el,f){return el.animate(f,{duration:T,iterations:Infinity})}
function K(s,e,from,to,ease){var a=Object.assign;return[a({offset:0},from),a({offset:s,easing:ease||EO},from),a({offset:e},to),a({offset:1},to)]}
var host=$('bands'),bars=[],acc;
for(var i=0;i<N;i++){
 var y=40+12*i;
 var r=mk('rect',{x:40,y:y,width:140,height:10,fill:'url(#bg)','class':'bar'});host.appendChild(r);bars.push(r);
 if(i==ACC){acc=mk('rect',{x:40,y:y,width:140,height:10,fill:'var(--acc)','class':'bar'});host.appendChild(acc)}
}
var word=$('word'),letters=[];
'PAYWELL'.split('').forEach(function(ch){var m=document.createElement('span');m.className='m';var c=document.createElement('span');c.className='c';c.textContent=ch;m.appendChild(c);word.appendChild(m);letters.push(c)});
if(calm)return;
var S='scaleX(0)',F='scaleX(1)';
bars.forEach(function(r,i){var s=.02+.018*i;A(r,K(s,s+.17,{transform:S},{transform:F}))});
A(acc,K(.56,.67,{transform:S},{transform:F}));
A($('shine'),[{offset:0,transform:'translateX(-60px)',opacity:0},{offset:.70,transform:'translateX(-60px)',opacity:0},{offset:.72,transform:'translateX(-60px)',opacity:.5,easing:'cubic-bezier(.45,0,.25,1)'},{offset:.85,transform:'translateX(200px)',opacity:.5},{offset:.87,transform:'translateX(200px)',opacity:0},{offset:1,transform:'translateX(200px)',opacity:0}]);
letters.forEach(function(c,j){var s=.26+.022*j;A(c,K(s,s+.17,{transform:'translateY(112%)'},{transform:'translateY(0)'}))});
A($('mark'),K(0,.42,{transform:'scale(.96)'},{transform:'scale(1)'}));
A($('vd'),K(.22,.40,{transform:'scaleY(0)'},{transform:'scaleY(1)'}));
A($('rule'),K(.46,.60,{transform:S},{transform:F}));
A($('tag'),K(.52,.66,{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}));
A($('glow'),K(0,.5,{opacity:0},{opacity:1},'ease-out').map(function(k){k.transform='translate(-50%,-50%)';return k}));
A($('stage'),[{offset:0,opacity:1,transform:'none'},{offset:.915,opacity:1,transform:'none',easing:'ease-in-out'},{offset:1,opacity:0,transform:'translateY(-6px)'}]);
})();
</script>
</body>
</html>
