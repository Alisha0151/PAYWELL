# Local development stack. Requires a .env file (copy ../.env.example). Payments are SIMULATED.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paywell}
      POSTGRES_USER: ${POSTGRES_USER:-paywell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  fraud-service:
    build: ../fraud-service
    environment:
      FRAUD_SERVICE_TOKEN: ${FRAUD_SERVICE_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
  backend:
    build: ../backend
    depends_on:
      postgres: {condition: service_healthy}
      fraud-service: {condition: service_started}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paywell}
      DB_USER: ${POSTGRES_USER:-paywell}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PAYWELL_JWT_SECRET: ${PAYWELL_JWT_SECRET:?set PAYWELL_JWT_SECRET in .env}
      PAYWELL_WEBHOOK_SECRET: ${PAYWELL_WEBHOOK_SECRET:-}
      PAYWELL_CORS_ORIGINS: ${PAYWELL_CORS_ORIGINS:-http://localhost:3000}
      FRAUD_SERVICE_URL: http://fraud-service:8000
      FRAUD_SERVICE_TOKEN: ${FRAUD_SERVICE_TOKEN:-}
      PAYWELL_KAFKA_ENABLED: ${PAYWELL_KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports: ["8080:8080"]
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
volumes:
  pgdata:
